<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Login</title>
		<style>
			body{
				background-color: black;
			}
			form{
				position: absolute;
				left: 50%;
				top: 50%;
				translate: -50% -50%;
				display: grid;
				width: max-content;
				background-color: #111;
				padding: 20px;
				border: none;
				border-radius: 10px;
			}
			h1{
				color: white;
			}
			form label{
				color: white;
			}
			form input{
				width: 30vw;
				border: none;
				border-radius: 10px;
				padding: 10px;
				margin: 10px;
			}
			button{
				background-color: #333;
				color:white;
				border: none;
				border-radius: 10px;
				padding: 10px;
				margin: 10px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<form method="POST">
				<h1>Login</h1>
				<label for="username">Username</label>
				<input name="username" type="text" value="" required/>
				<label for="password">Password</label>
				<input name="password" type="password" value="" required/>
				<button type="submit">Login</button>
			</form>
		</div>
	</body>
</html>
