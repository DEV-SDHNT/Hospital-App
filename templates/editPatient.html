<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>
    <style>
        body{
            background-color: black;
            color: white;
        }
        h1{
            text-align: center;
        }
        .logout{
            position: absolute;
            right: 2vw;
            top:2vh;
        }
        h2{
            text-align: center;
        }
        a{
            color: white;
            text-decoration: none;
        }
        button{
            background-color: #222;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 10px;
            margin: 5px;
        }
        form{
				position: absolute;
				left: 50%;
				top: 50%;
				translate: -50% -50%;
				display: grid;
			}
			form input{
				padding: 10px;
				margin: 10px;
				width: 50vw;
				border: none;
				border-radius: 10px;
			}
    </style>
</head>
<body>
    <h1>Edit Patient-Details:</h1>    
    {{ if eq .role "doctor"}}
    <form action="/doctor/dashboard/edit/{{ .patient.ID }}" method="post">
    {{ else }}
    <form action="/receptionist/dashboard/edit/{{ .patient.ID }}" method="post">
    {{ end }}
        <label for="Name">Name:</label>
        <input type="text" name="Name" value="{{ .patient.Name }}" required><br>
        <label for="Illness">Illness:</label>
        <input type="text" name="Illness" value="{{ .patient.Illness }}"><br>
        <label for="Address">Address:</label>
        <input type="text" name="Address" value="{{ .patient.Address }}"><br>
        <label for="Date">Date:</label>
        <input type="text" name="Date" value="{{ .patient.Date }}"><br>
        <label for="Bed">Bed no.:</label>
        <input type="text" name="Bed" value="{{ .patient.Bed }}"><br>
        <button type="submit">Edit </button>
    </form>
</body>
</html>
